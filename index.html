

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Study AI v3.0 - Upper Secondary SPM</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --sidebar-bg: #111827;
            --panel-bg: #161e2e;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        sidebar { width: 320px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .logo-icon { font-size: 26px; background: rgba(99, 102, 241, 0.1); padding: 8px; border-radius: 10px; }
        .logo-title { font-size: 18px; font-weight: bold; }
        .logo-subtitle { font-size: 12px; color: var(--text-muted); }
        .new-chat-btn { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .section-title { font-size: 11px; color: var(--text-muted); letter-spacing: 1.2px; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; }
        .subject-list { display: flex; flex-direction: column; gap: 6px; }
        .subject-btn { background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-muted); text-align: left; padding: 11px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
        .subject-btn.active { background-color: rgba(99, 102, 241, 0.15); border-color: var(--accent); color: var(--text-main); font-weight: bold; }
        .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; background-color: var(--bg-dark); }
        .top-bar { padding: 15px 25px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background-color: var(--panel-bg); }
        .chat-messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 85%; padding: 16px; border-radius: 12px; line-height: 1.6; font-size: 15px; word-break: break-word; }
        .message.assistant { background-color: var(--panel-bg); border: 1px solid var(--border-color); align-self: flex-start; color: var(--text-main); }
        .message.user { background-color: var(--accent); color: white; align-self: flex-end; }
        .input-container { padding: 20px 25px; background-color: var(--panel-bg); border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .chat-input { flex: 1; background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 15px; border-radius: 8px; font-size: 14px; outline: none; }
        .send-btn { background-color: var(--accent); color: white; border: none; width: 45px; height: 45px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    </style>
</head>
<body>
    <sidebar>
        <div class="logo-area">
            <div class="logo-icon">🧠</div>
            <div>
                <div class="logo-title">Core Study AI v3.0</div>
                <div class="logo-subtitle">Smart Student Assistant</div>
            </div>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">✨ New Chat Session</button>
        <div class="section-title">SELECT SUBJECT</div>
        <div class="subject-list" id="subjectList">
            <button class="subject-btn active" data-subject="Biologi" onclick="selectSubject('Biologi')"><span>🧬 Biologi</span></button>
            <button class="subject-btn" data-subject="Kimia" onclick="selectSubject('Kimia')"><span>🧪 Kimia</span></button>
            <button class="subject-btn" data-subject="Fizik" onclick="selectSubject('Fizik')"><span>⚡ Fizik</span></button>
            <button class="subject-btn" data-subject="Matematik Tambahan" onclick="selectSubject('Matematik Tambahan')"><span>📐 Matematik Tambahan</span></button>
            <button class="subject-btn" data-subject="Sejarah" onclick="selectSubject('Sejarah')"><span>📜 Sejarah</span></button>
        </div>
    </sidebar>

    <div class="main-container">
        <div class="top-bar">
            <div class="breadcrumb">Form 4–5 / SPM > <span id="currentSubjectDisplay">Biologi</span></div>
            <div style="color: #22c55e; font-size: 12px; font-weight: bold;">🟢 Python Connected</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                Ready for <span id="welcomeSubject">Biologi</span>! Ask a question or request notes.
            </div>
        </div>

        <div class="input-container">
            <input type="text" class="chat-input" id="userInput" placeholder="Ask any question..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">➔</button>
        </div>
    </div>

    <script>
        let currentSubject = "Biologi";
        let currentLanguage = "English";

        function selectSubject(subject) {
            currentSubject = subject;
            document.getElementById('currentSubjectDisplay').innerText = subject;
            document.getElementById('chatMessages').innerHTML = `
                <div class="message assistant">Ready for ${subject}! Ask a question or request notes.</div>
            `;
            document.querySelectorAll('.subject-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-subject') === subject);
            });
        }

        function startNewChat() { selectSubject(currentSubject); }
        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if(!messageText) return;

            const chatMessages = document.getElementById('chatMessages');
            
            let userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.innerText = messageText;
            chatMessages.appendChild(userMsgDiv);

            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            let botMsgDiv = document.createElement('div');
            botMsgDiv.className = 'message assistant';
            botMsgDiv.innerHTML = `<em>Thinking...</em>`;
            chatMessages.appendChild(botMsgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText, subject: currentSubject, language: currentLanguage })
                });

                const data = await response.json();
                if (data.reply) {
                    botMsgDiv.innerHTML = marked.parse(data.reply);
                } else {
                    botMsgDiv.innerHTML = "Error generating response.";
                }
            } catch (error) {
                botMsgDiv.innerHTML = "Connection error with Python backend.";
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
